apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "egwha.fullname" . }}-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "egwha.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "egwha.fullname" . }}-agent
  labels:
    {{- include "egwha.labels" . | nindent 4 }}
rules:
- apiGroups: ["egressgateway-ha.spidernet.io"]
  resources: ["egressgatewayhas"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["egressgateway-ha.spidernet.io"]
  resources: ["egressgatewayhas/status"]
  verbs: ["patch"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get"]
- apiGroups: ["cilium.io"]
  resources: ["ciliumnodes"]
  verbs: ["get", "patch"]
- apiGroups: ["cilium.io"]
  resources: ["ciliumegressgatewaypolicies"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "egwha.fullname" . }}-agent
  labels:
    {{- include "egwha.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "egwha.fullname" . }}-agent
subjects:
- kind: ServiceAccount
  name: {{ include "egwha.fullname" . }}-agent
  namespace: {{ .Release.Namespace }}
