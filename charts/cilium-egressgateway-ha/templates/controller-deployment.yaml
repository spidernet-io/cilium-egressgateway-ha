apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "egwha.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "egwha.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: controller
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/controller-config.yaml") . | sha256sum }}
        {{- with .Values.controller.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "egwha.fullname" . }}-controller
      {{- with .Values.controller.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: {{ .Release.Name }}
                  app.kubernetes.io/component: controller
      containers:
      - name: controller
        image: {{ include "egwha.image" (dict "root" . "image" .Values.controller.image) }}
        imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
        command: ["/usr/local/bin/controller"]
        args:
        - --default-spec=/etc/egressgateway-ha/default-spec.yaml
        - --resync-interval={{ .Values.controller.resyncInterval }}
        {{- include "egwha.activeNodeLabelArgs" . | nindent 8 }}
        {{- with .Values.controller.egressNodeProbe }}
        - --egress-node-probe={{ .enabled }}
        - --egress-node-probe-port={{ .port }}
        - --egress-node-probe-timeout={{ .timeout }}
        - --egress-node-probe-interval={{ .interval }}
        - --egress-node-probe-failure-threshold={{ .failureThreshold }}
        {{- end }}
        {{- with .Values.controller.ciliumAgentCheck }}
        - --cilium-agent-check={{ .enabled }}
        - --cilium-namespace={{ .namespace }}
        - --cilium-agent-selector={{ .selector }}
        {{- end }}
        - --agent-selector=app.kubernetes.io/instance={{ .Release.Name }},app.kubernetes.io/component=agent
        - --health-probe-bind-address=:{{ .Values.controller.healthPort }}
        - --metrics-bind-address=:{{ .Values.controller.metricsPort }}
        - --zap-log-level={{ .Values.controller.logLevel }}
        - --webhook-port={{ .Values.controller.webhookPort }}
        - --webhook-service={{ include "egwha.fullname" . }}-webhook
        - --webhook-secret={{ include "egwha.fullname" . }}-webhook-cert
        {{- if .Values.ciliumEgressPolicyWebhook.enabled }}
        - --mutating-webhook-configuration={{ include "egwha.fullname" . }}-webhook
        {{- end }}
        - --validating-webhook-configuration={{ include "egwha.fullname" . }}-webhook
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - name: webhook
          containerPort: {{ .Values.controller.webhookPort }}
        - name: metrics
          containerPort: {{ .Values.controller.metricsPort }}
        - name: health
          containerPort: {{ .Values.controller.healthPort }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 10
        volumeMounts:
        - name: config
          mountPath: /etc/egressgateway-ha
          readOnly: true
        {{- with .Values.controller.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      volumes:
      - name: config
        configMap:
          name: {{ include "egwha.fullname" . }}-controller
