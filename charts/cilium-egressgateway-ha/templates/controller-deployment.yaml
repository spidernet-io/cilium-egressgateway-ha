apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "egwha.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "egwha.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: controller
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/controller-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "egwha.fullname" . }}-controller
      {{- with .Values.controller.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: {{ .Release.Name }}
                  app.kubernetes.io/component: controller
      containers:
      - name: controller
        image: {{ include "egwha.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/usr/local/bin/controller"]
        args:
        - --default-spec=/etc/egressgateway-ha/default-spec.yaml
        - --resync-interval={{ .Values.controller.resyncInterval }}
        - --probe-port={{ .Values.controller.nodeProbe.port }}
        - --probe-timeout={{ .Values.controller.nodeProbe.timeout }}
        - --probe-interval={{ .Values.controller.nodeProbe.interval }}
        - --probe-failure-threshold={{ .Values.controller.nodeProbe.failureThreshold }}
        - --cilium-namespace={{ .Values.controller.ciliumNamespace }}
        - --cilium-agent-selector={{ .Values.controller.ciliumAgentSelector }}
        - --agent-selector=app.kubernetes.io/instance={{ .Release.Name }},app.kubernetes.io/component=agent
        - --health-probe-bind-address=:{{ .Values.controller.healthPort }}
        - --metrics-bind-address=:{{ .Values.controller.metricsPort }}
        - --zap-log-level={{ .Values.controller.logLevel }}
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - name: metrics
          containerPort: {{ .Values.controller.metricsPort }}
        - name: health
          containerPort: {{ .Values.controller.healthPort }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 10
        volumeMounts:
        - name: config
          mountPath: /etc/egressgateway-ha
          readOnly: true
        {{- with .Values.controller.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      volumes:
      - name: config
        configMap:
          name: {{ include "egwha.fullname" . }}-controller
