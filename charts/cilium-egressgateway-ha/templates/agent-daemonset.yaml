apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "egwha.fullname" . }}-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "egwha.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      # Never run two agents on the same node.
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: agent
      {{- with .Values.agent.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "egwha.fullname" . }}-agent
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .Values.agent.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
                {{- include "egwha.egressNodeMatchExpressions" . | trim | nindent 16 }}
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: agent
        image: {{ include "egwha.image" (dict "root" . "image" .Values.agent.image) }}
        imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
        command: ["/usr/local/bin/agent"]
        args:
        - --reconcile-interval={{ .Values.agent.reconcileInterval }}
        {{- include "egwha.activeNodeLabelArgs" . | nindent 8 }}
        - --garp-interval={{ .Values.agent.garpInterval }}
        - --health-probe-bind-address=:{{ .Values.agent.healthPort }}
        - --metrics-bind-address=:{{ .Values.agent.metricsPort }}
        - --zap-log-level={{ .Values.agent.logLevel }}
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        ports:
        - name: metrics
          containerPort: {{ .Values.agent.metricsPort }}
        securityContext:
          capabilities:
            drop: ["ALL"]
            add: ["NET_ADMIN", "NET_RAW"]
        readinessProbe:
          httpGet:
            path: /readyz
            port: {{ .Values.agent.healthPort }}
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.agent.healthPort }}
          periodSeconds: 10
        {{- with .Values.agent.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
