image:
  repository: ghcr.io/spidernet-io/cilium-egressgateway-ha
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Used by the controller to create EgressGatewayHA "default" when it does not
# exist. candidateNodeSelector also limits where the agent DaemonSet runs.
egressGatewayHA:
  # Required, e.g.
  #   matchLabels:
  #     node-role.example.com/egress: "true"
  candidateNodeSelector: {}
  interface: eth0
  # Single IPs and "start-end" ranges.
  egressIPs: []
  # Defaults to the first IP of egressIPs.
  defaultEgressIP: ""

agent:
  # Interval of the periodic reconcile.
  reconcileInterval: 10s
  # Interval of periodic gratuitous ARP; 0s only sends it when an egress IP is added.
  garpInterval: 0s
  # Health probe port on the host network.
  healthPort: 9790
  logLevel: info
  priorityClassName: system-node-critical
  # Gateway nodes are often tainted; tolerate everything by default.
  tolerations:
  - operator: Exists
  resources: {}

controller:
  replicas: 2
  # Interval of the periodic reconcile.
  resyncInterval: 10s
  # TCP probe of the candidate nodes' InternalIP.
  nodeProbe:
    # TCP port; defaults to the kubelet port. A refused connection also counts as alive.
    port: 10250
    # Timeout of one connection attempt; the kernel retransmits SYN within it.
    timeout: 2s
    # Wait time after a probe finishes before the next one.
    interval: 5s
    # Consecutive failures that mark a node failed.
    failureThreshold: 3
  # Where cilium-agent pods run; their readiness filters new active nodes.
  ciliumNamespace: kube-system
  ciliumAgentSelector: k8s-app=cilium
  healthPort: 8081
  metricsPort: 8080
  logLevel: info
  priorityClassName: system-cluster-critical
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule
  resources: {}

webhook:
  # Port of the webhook server in the controller pods.
  port: 9443
  timeoutSeconds: 10
