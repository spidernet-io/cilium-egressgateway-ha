name: CI

on:
  pull_request:
    paths:
    - "**.go"
    - go.mod
    - go.sum
    - charts/**
    - Dockerfile
    - Makefile
    - test/**
    - .github/workflows/ci.yaml
  push:
    branches: [main]
    paths:
    - "**.go"
    - go.mod
    - go.sum
    - charts/**
    - Dockerfile
    - Makefile
    - test/**
    - .github/workflows/ci.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - uses: azure/setup-helm@v4
    - name: Check generated files
      run: |
        make generate
        git diff --exit-code
    - name: Vet
      run: make vet
    - name: Lint chart
      run: make lint-chart
    - name: Unit tests
      run: go test ./...
    # The netops tests need root to create an isolated network namespace.
    - name: Unit tests as root
      run: sudo -E env "PATH=$PATH" go test ./pkg/netops/

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TAG: ${{ github.sha }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - uses: azure/setup-helm@v4
    - uses: helm/kind-action@v1
      with:
        install_only: true
    - name: Raise inotify limits for kind
      run: |
        sudo sysctl -w fs.inotify.max_user_instances=512
        sudo sysctl -w fs.inotify.max_user_watches=524288
    - name: Create the kind cluster with the latest Cilium
      run: make e2e-cluster
    - name: Build images and install
      run: make e2e-deploy
    - name: Run e2e tests
      run: make e2e-test
    - name: Collect logs
      if: failure()
      run: make e2e-logs
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-report
        path: |
          .e2e/report
          .e2e/logs
        if-no-files-found: ignore
